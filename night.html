<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>深夜的电脑前 · 引路灯 · 阿满</title>
  <link rel="stylesheet" href="assets/css/y2k.css" />
  <!--
    引路灯词（口传，只传首字母）：h.d.z.s · h.g.g.l
    河灯照水 · 魂归故里
    诵全词，灯灭，魂归。若不诵，灯不灭，他永远在线。
  -->
</head>
<body data-page="night">
  <div class="crt-scan"></div>
  <div class="blood-flash" id="bloodFlash"></div>

  <div class="page">
    <div class="glass" style="padding:20px 18px 10px;text-align:center;">
      <div class="site-title" style="font-size:30px;">深 夜 的 电 脑 前</div>
      <div class="site-sub" id="subtitle">七月十四 · 子时 · 废弃大楼 · 7 层机房</div>
      <div class="glitter-bar"></div>
    </div>

    <!-- 仪式区 -->
    <div class="glass" style="margin-top:14px;padding:18px;text-align:center;">
      <img id="lanternImg" src="assets/img/he_deng.jpg" alt="河灯"
           style="max-width:380px;width:92%;border:3px outset #ccc;" />
      <p style="font-size:15px;line-height:2;margin-top:14px;color:#222;">
        屏幕上，月光小筑的编辑界面还亮着。<br />
        光标停在最后一行的末尾，像是在等谁打完一句话。<br />
        档案上写着，要面河诵出<b>引路灯词</b>，灯才灭，阿满才"下线"。<br />
        <span class="ghost-text">（灯词藏在相册、档案、留言板里——首字母是 h.d.z.s · h.g.g.l）</span>
      </p>
      <div style="margin-top:10px;">
        <input class="y2k-input" id="word" placeholder="请输入灯词（如：河灯照水 魂归故里）" style="width:300px;max-width:90%;" />
        <button class="y2k-submit" onclick="chant()" style="margin-left:8px;">诵 灯 词</button>
      </div>
      <div id="ritualMsg" style="font-size:14px;color:#888;margin-top:12px;min-height:22px;">屏幕很安静。光标在闪。</div>
    </div>

    <div class="footer-y2k">
      ◆ 月光小筑 · 深夜的电脑前 ◆ <a href="index.html">回到月光小筑</a> ◆ <a href="archive.html">档案</a> ◆<br />
      <span class="ghost-text">诵词请一次诵全，不要回头。</span>
    </div>
  </div>

  <script src="assets/js/shared.js"></script>
  <script>
    window.__ms_console_notes = [
      '%c深夜的电脑前',
      'color:#1a6fbe;',
      '灯词：河灯照水 · 魂归故里。',
      '如果你不引路，阿满永远在线。',
      '他等一个记住他的人。'
    ];

    const ACCEPT = [
      '河灯照水魂归故里',
      '河灯照水 魂归故里',
      '河灯照水·魂归故里',
      '河灯照水，魂归故里',
      'hdzs hggl', 'h.d.z.s h.g.g.l', 'HDZS HGGL', 'H.D.Z.S H.G.G.L'
    ];

    function chant() {
      const raw = document.getElementById('word').value.trim().toLowerCase()
        .replace(/[，,。.·\s]/g, '');
      const msg = document.getElementById('ritualMsg');
      const isAccept = ACCEPT.some((a) => a.replace(/[，,。.·\s]/g, '').toLowerCase() === raw);

      if (isAccept) {
        endingA();
      } else if (raw.length === 0) {
        msg.innerHTML = '光标跳了一下。它在等你开口。';
      } else {
        msg.innerHTML = '灯没有灭。屏幕倒映出……<b style="color:var(--red);">你身后有个人影</b>。';
        document.body.classList.add('cursed');
        setTimeout(() => document.body.classList.remove('cursed'), 900);
      }
    }

    /* ── 结局 A：引路 · 安息 ── */
    function endingA() {
      const msg = document.getElementById('ritualMsg');
      document.getElementById('subtitle').textContent = '灯灭了 · 风停了 · 光标停了';
      document.getElementById('word').style.display = 'none';
      document.querySelector('.y2k-submit').style.display = 'none';
      document.body.classList.remove('cursed');
      msg.innerHTML = '';
      document.getElementById('lanternImg').style.filter = 'sepia(.3) brightness(1.05)';

      const lines = [
        '……',
        '屏幕上的光标，停了。',
        '那盏灯，晃了晃，灭了。',
        '风从窗口吹进来，很轻，像是有人在很远的地方，长长地舒了一口气。',
        '',
        '★ 管理员「阿满」已下线 ★',
        '……谢谢你，记得我。',
        '河灯照水，魂归故里。',
        '别删我的主页，让它亮着吧——总还有人，需要一点光。',
        '千禧年快乐。再见。',
        '（本页最后更新：2003-08-11 23:47 · 已归档，不再更新）'
      ];
      let i = 0;
      const timer = setInterval(() => {
        if (i >= lines.length) {
          clearInterval(timer);
          msg.innerHTML += '<div style="margin-top:16px;"><a class="y2k-btn" href="index.html">回到安安静静的小屋</a></div>';
          return;
        }
        const p = document.createElement('div');
        p.style.cssText = 'line-height:2;font-size:15px;margin:2px 0;color:#222;';
        p.textContent = lines[i];
        msg.appendChild(p);
        i++;
      }, 650);
    }
  </script>
</body>
</html>
